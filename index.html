<style>
:root{--paper:#DDDDDD;--ink:#111;--faint:rgba(17,17,17,.18);--hov:rgba(17,17,17,.05);--done:#2ecc71;--busy:#f39c12;--todo:#e74c3c;--edge:clamp(18px,3.6vw,64px);--serif:'Newsreader',Georgia,serif;--sans:Calibri,Carlito,'Segoe UI',system-ui,sans-serif;color-scheme:only light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:#DDDDDD !important;background-image:linear-gradient(#DDDDDD,#DDDDDD) !important}
*{box-sizing:border-box;margin:0;padding:0;font-family:var(--sans)}
body{background:#DDDDDD !important;background-image:linear-gradient(#DDDDDD,#DDDDDD) !important;color:#111 !important;min-height:100vh;font-size:16px;line-height:1.5;forced-color-adjust:none}
.wrap{max-width:1240px;margin:0 auto;padding:18px var(--edge) 60px}
.serif{font-family:var(--serif)}
.hd{border-top:1.5px solid #111;padding-top:14px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.hd h1{font-family:var(--serif);font-weight:400;font-size:clamp(28px,4vw,46px);line-height:1;letter-spacing:-.015em;cursor:pointer;color:#111}
.mic{font-size:14px;font-weight:600;letter-spacing:.04em;color:#111}
.user-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px;font-size:13px;font-weight:600;color:#111}
.user-link{background:none;border:0;color:#111;font-size:12px;font-weight:700;text-decoration:underline;cursor:pointer;padding:0}
.user-link:hover{opacity:.7}
nav{display:flex;gap:0;border-bottom:1.5px solid #111;margin:16px 0 28px;flex-wrap:wrap}
nav button{background:none;border:0;border-right:1px solid var(--faint);padding:11px 22px;font-size:15px;font-weight:600;letter-spacing:.03em;color:#111;cursor:pointer;display:flex;align-items:center;gap:8px}
nav button:hover{background:var(--hov)}
nav button.on{background:#111 !important;background-image:linear-gradient(#111,#111) !important;color:#DDDDDD !important}
.badge{font-size:11px;font-weight:700;padding:1px 6px;border:1px solid currentColor;letter-spacing:.04em;text-transform:uppercase}
.h2{font-family:var(--serif);font-weight:400;font-size:clamp(22px,2.2vw,32px);line-height:1.1;letter-spacing:-.01em;color:#111}
.sum{display:flex;gap:clamp(18px,4vw,56px);flex-wrap:wrap;align-items:flex-end;margin-bottom:30px}
.big{font-family:var(--serif);font-size:clamp(48px,7vw,92px);line-height:.9;letter-spacing:-.02em;color:#111}
.sum .it b{font-family:var(--serif);font-weight:400;font-size:34px;display:block;line-height:1;color:#111}
.sum .it span{font-size:14px;font-weight:600;display:flex;align-items:center;gap:7px;color:#111}
.dot{width:12px;height:12px;border-radius:50%;border:1px solid #111;display:inline-block}
.dg{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:clamp(18px,2.4vw,40px)}
.dc{border-top:1.5px solid #111;padding-top:14px;cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;color:#111;font:inherit}
.dc:hover{background:var(--hov)}
.dc .row{display:flex;align-items:center;gap:20px;margin-top:16px}
.pie{width:84px;height:84px;border-radius:50%;border:1.5px solid #111;flex:none}
.lg{display:flex;flex-direction:column;gap:5px;font-size:14px;font-weight:600;color:#111}
.lg span{display:flex;align-items:center;gap:8px}
.go{display:block;margin-top:14px;font-size:13px;font-weight:600;letter-spacing:.04em;opacity:.7;color:#111}
.lay{display:flex;gap:clamp(18px,3vw,48px);align-items:flex-start}
.menu{flex:0 0 250px;border-right:1.5px solid #111;padding-right:clamp(14px,2vw,32px);position:sticky;top:12px}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--faint);padding:12px 0;font-size:14px;font-weight:600;letter-spacing:.03em;color:#111;cursor:pointer}
.menu button:hover{background:var(--hov);padding-left:10px}
.menu button.on{background:#111 !important;background-image:linear-gradient(#111,#111) !important;color:#DDDDDD !important;padding-left:14px;border-bottom-color:#111}
.menu small{display:block;font-weight:400;font-size:12px;opacity:.7;margin-top:2px}
.main{flex:1;min-width:0}
.main .h2{margin-bottom:6px}
.sub{font-size:14px;opacity:.7;margin-bottom:18px;color:#111}
.ci{display:flex;gap:20px;align-items:flex-start;padding:13px 0;border-bottom:1px solid var(--faint)}
.ci:hover{background:var(--hov)}
.ci select{padding:5px 8px;border:1.5px solid #111;background:#DDDDDD !important;color:#111 !important;font-size:14px;font-weight:600;cursor:pointer;width:112px;border-radius:0;flex:none}
.ci.done .tx{text-decoration:line-through;opacity:.5}
.ci .no{font-size:12px;font-weight:600;letter-spacing:.04em;opacity:.65;display:block;margin-bottom:3px;color:#111}
.ci .tx{font-size:15px;color:#111}
.bl{border-top:1.5px solid #111;padding:14px 0 18px;transition:background .4s}
.bl.hl{background:var(--hov)}
.tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border:1.5px solid #111;margin-bottom:8px;margin-right:6px;color:#111}
.bl.e .tag,.tag.inv{background:#111 !important;background-image:linear-gradient(#111,#111) !important;color:#DDDDDD !important}
.tag.new{background:var(--busy) !important;color:#111 !important;border-color:#111}
.bl h4{font-family:var(--serif);font-weight:400;font-size:21px;line-height:1.15;margin-bottom:5px;color:#111}
.bl p{font-size:15.5px;max-width:70ch;color:#111}
.bl a{color:#111;font-size:14px;font-weight:600;display:inline-block;margin-top:8px;text-underline-offset:3px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:18px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.btn{background:none;border:1.5px solid #111;color:#111;font-size:13px;font-weight:600;padding:6px 12px;cursor:pointer}
.btn:hover,.btn.on{background:#111 !important;background-image:linear-gradient(#111,#111) !important;color:#DDDDDD !important}
.rg{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-bottom:24px}
.rc{border:1.5px solid #111;padding:14px 16px}
.rc h4{font-family:var(--serif);font-weight:400;font-size:20px;margin:6px 0 4px;color:#111}
.rc .meta{font-size:14px;font-weight:600;color:#111}
.rc a{color:#111;font-size:13px;font-weight:600;display:inline-block;margin-top:8px}
.sec{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin:20px 0 10px;opacity:.75;color:#111}
.back{margin-top:14px;background:none;border:1.5px solid #111;color:#111;font-size:13px;font-weight:600;padding:6px 12px;cursor:pointer}
.rs{margin-top:44px;background:none;border:0;font-size:13px;opacity:.6;cursor:pointer;color:#111;text-decoration:underline}
.rs.armed{opacity:1;font-weight:700;color:var(--todo);text-decoration:none;border:1.5px solid var(--todo);padding:6px 12px}

/* Beginscherm / Inloggen */
.login-wrap{max-width:520px;margin:36px auto 0;border-top:1.5px solid #111;border-bottom:1.5px solid #111;padding:28px 0}
.login-logo{width:76px;height:76px;object-fit:contain;display:block;margin-bottom:16px;border:1.5px solid #111;background:#DDDDDD}
.login-wrap h2{font-family:var(--serif);font-weight:400;font-size:clamp(26px,3.2vw,38px);line-height:1.1;margin-bottom:10px;color:#111}
.login-wrap p{font-size:15px;opacity:.8;margin-bottom:18px;color:#111}
.login-modes{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.login-modes button{background:none;border:1.5px solid #111;color:#111;font-size:13px;font-weight:700;padding:7px 12px;cursor:pointer}
.login-modes button.on{background:#111 !important;background-image:linear-gradient(#111,#111) !important;color:#DDDDDD !important}
.login-form{display:flex;flex-direction:column;gap:14px}
.login-form label{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#111}
.login-form input{padding:11px 14px;border:1.5px solid #111;background:#DDDDDD !important;color:#111 !important;font-size:16px;border-radius:0;outline:none}
.login-form input:focus{box-shadow:inset 0 0 0 1px #111}
.login-err{color:#b00020;font-size:14px;font-weight:700;min-height:20px}
.login-submit{align-self:flex-start;background:#111 !important;background-image:linear-gradient(#111,#111) !important;color:#DDDDDD !important;border:1.5px solid #111;padding:10px 22px;font-size:14px;font-weight:700;letter-spacing:.03em;cursor:pointer}
.login-submit:hover{opacity:.88}
.login-submit:disabled{opacity:.5;cursor:wait}

/* Wijzigingenlog (Outlook-stijl ongelezen / gelezen) */
.log-item{border-top:1px solid var(--faint);padding:12px 10px;display:flex;flex-direction:column;gap:4px;cursor:pointer;transition:background .15s}
.log-item:last-child{border-bottom:1px solid var(--faint)}
.log-item:hover{background:var(--hov)}
.log-item.unread{border-left:4px solid #111;padding-left:14px;background:rgba(17,17,17,.04)}
.log-item.read{opacity:.65}
.log-badge-new{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:1px 6px;background:#111;color:#DDDDDD;margin-right:8px}
.log-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;font-size:13px;font-weight:700;color:#111}
.log-date{font-size:12px;opacity:.7;font-weight:600}
.log-desc{font-size:15px;color:#111}

@media(max-width:760px){.lay{flex-direction:column}.menu{flex:none;width:100%;border-right:0;border-bottom:1.5px solid #111;padding:0 0 10px;position:static}.ci{flex-wrap:wrap}}
</style>
</head>
<body>
<div class="wrap">
<div class="hd">
  <div>
    <h1 id="home">Kwaliteitshandboek<br>Monumentaal schilderwerk</h1>
    <div class="user-bar" id="user-bar" style="display:none">
      <span>Ingelogd als <strong id="logged-user"></strong></span>
      <button type="button" class="user-link" id="change-user">Uitloggen</button>
    </div>
  </div>
  <span class="mic">PlenderWestendorp</span>
</div>

<div id="login-screen" style="display:none">
  <div class="login-wrap">
    <img src="PlenderWestendorp_app-icoon_512.png" alt="PlenderWestendorp" class="login-logo">
    <h2 id="login-title">Inloggen kwaliteitshandboek</h2>
    <p id="login-sub">Log in met je eigen gebruikersnaam en wachtwoord. Je wordt bij elk bezoek opnieuw gevraagd in te loggen.</p>
    <div class="login-modes">
      <button type="button" id="mode-login" class="on">Inloggen</button>
      <button type="button" id="mode-register">Nieuw account aanmaken</button>
    </div>
    <form class="login-form" id="login-form">
      <label for="username-input">Gebruikersnaam</label>
      <input id="username-input" type="text" autocomplete="username" placeholder="Bijv. Thijs" required>
      <label for="password-input">Wachtwoord</label>
      <input id="password-input" type="password" autocomplete="current-password" placeholder="Vul wachtwoord in" required>
      <div class="login-err" id="login-error"></div>
      <button type="submit" class="login-submit" id="login-submit-btn">Inloggen</button>
    </form>
  </div>
</div>

<div id="app-shell" style="display:none">
  <nav id="nav"></nav>
  <div id="v"></div>
</div>
</div>
<script>
var AUTH_API = "https://kwaliteit-auth.thijsdemoor.workers.dev";
var ERM_API = "https://erm-updates.thijsdemoor.workers.dev";
var SYNC_BINDING = "CLOUD_WIJZIGINGEN_GEBRUIKER";
var SYNC_API = "https://cloudwijzigingengebruiker.thijsdemoor.workers.dev";
var READ_API = "https://wijzigingen-gelezen.thijsdemoor.workers.dev";

var D=[
{c:"1. Introductie",t:["1. Introductie"]},
{c:"2. Eisen aan bedrijf",t:["2.1 Afschrift KvK","2.2 Bedrijfsprofiel","2.3 Bedrijfsuitrusting/meetmiddelen","2.4 Ervaring van bedrijf","2.5 Opleiding","2.6 Continuïteit van kennis","2.7 Bedrijfsaansprakelijkheid","2.8 Bedrijfsgrootte"]},
{c:"3. Eisen organisatie",t:["3.1 Beleid","3.2 Overlegstructuur","3.3 Inkoop","3.4 Beoordeling onderaannemers","3.5 Wet- en regelgeving","3.6 Gebruik logo ERM"]},
{c:"4. Eisen proces",t:["4.1 Algemeen","4.1.1 Uitgangspunten beslissingen","4.1.2 Werkwijze restauratieladder","4.2 Eisen restauratieproces","4.2.1 Bouwtechnische opname","4.2.2 Vergunningen","4.2.3 Contractvorming","4.2.4 Onderaanneming","4.2.5 Werkvoorbereiding","4.2.6 Uitvoering","4.2.7 Oplevering/nazorg","4.3 Goedkeurmomenten","4.4 Afbakening verantwoordelijkheid"]},
{c:"5. Eisen systeem",t:["5.2 Verantwoordelijkheid","5.3 Klacht","5.4 Meetmiddelen","5.5 Externe Kwaliteitsbewaking","5.6 Interne Kwaliteitsbewaking"]},
{c:"6. Bijlages",t:["Referentielijst","Scholingsplan","KvK uittreksel","Bedrijfsaansprakelijkheidsverzekering","Checklist contractvorming","Opnameformulier","Checklist werkvoorbereiding","Projectdossier structuur","Opleverformulier","Directiebeoordeling","Jaarplanning kwaliteitssysteem","Interne audit formulier","Projectevaluatie formulier","Beoordeling leveranciers","Klachtenformulier / proces verbaal"]}];

var K=[
{id:"live",n:"Actueel · ERM-updates",live:true},
{id:"monument",n:"Wat is monumentaal schilderwerk?",b:[
["t","Korte uitleg","Monumentaal schilderwerk is het onderhouden en herstellen van schilderwerk aan monumenten. Oude details, materialen en verflagen zijn vaak niet zomaar opnieuw te maken. Daarom kijk je bij elke klus eerst wat je kunt behouden, voordat je iets vervangt."],
["t","Duidelijke regels voor kwaliteit","Voor het werken aan monumenten gelden in Nederland vaste afspraken. Die gaan over hoe je het werk voorbereidt, hoe je het uitvoert en hoe het bedrijf is georganiseerd. Zo blijft het werk van goede kwaliteit en blijft het gebouw goed beschermd."],
["t","Controle door Kiwa","Kiwa is een onafhankelijke organisatie die het certificaat uitgeeft. Zij controleren regelmatig op kantoor en op projecten op locatie of het bedrijf zich aan alle afspraken houdt."]]},
{id:"erm",n:"ERM, BRL 4000 en URL’s",b:[
["t","Stichting ERM","Stichting ERM (Erkende Restauratiekwaliteit Monumentenzorg) is de landelijke organisatie die de regels opstelt voor onderhoud en herstel van monumenten. Het doel is dat het schilderwerk technisch goed wordt uitgevoerd én dat het gebouw zijn oorspronkelijke uitstraling behoudt."],
["e","BRL 4000: regels voor het bedrijf","De BRL 4000 beschrijft waar een bedrijf aan moet voldoen om een certificaat te krijgen. Er wordt onder andere gekeken naar de opleiding van medewerkers, aantoonbare ervaring met monumenten, vaste werkafspraken, eigen controles en een goede administratie (zoals dit kwaliteitshandboek)."],
["t","URL’s (zoals URL 4009): regels voor het werk","Een URL (Uitvoeringsrichtlijn) gaat over het werk op de bouwplaats zelf. Voor schilderwerk is dat URL 4009. Zo blijft het verschil duidelijk tussen de kwaliteit van het bedrijf (BRL) en de kwaliteit van het schilderwerk (URL)."]]}];

var KEY="cobalt_kwaliteit_status_v3",META_KEY="cobalt_kwaliteit_meta_v1",ERM_CACHE_KEY="cobalt_erm_cache_v1",ERM_SEEN_KEY="cobalt_erm_seen_v1",USER_KEY="cobalt_kwaliteit_user_v1",LOG_KEY="cobalt_kwaliteit_log_v1",READ_KEY="cobalt_kwaliteit_read_v1";
var S={},L=[],readIds=[],currentUser="",authMode="login",lastUpdatedAt="",view="d",ch=0,ar=0,ermFilter="rel",rsArmed=false,rsTimer=null,syncStatus="",savingInFlight=false;
var ermState={loading:false,error:null,data:null,offline:false,newCount:0,changedCodes:{}};

try{localStorage.removeItem(USER_KEY)}catch(e){}
try{S=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}
try{L=JSON.parse(localStorage.getItem(LOG_KEY))||[];if(!Array.isArray(L))L=[]}catch(e){L=[]}
try{readIds=JSON.parse(localStorage.getItem(READ_KEY))||[];if(!Array.isArray(readIds))readIds=[]}catch(e){readIds=[]}
try{lastUpdatedAt=localStorage.getItem(META_KEY)||""}catch(e){}
try{ermState.data=JSON.parse(localStorage.getItem(ERM_CACHE_KEY))||null}catch(e){}

function statusLabel(st){
  if(st==="done")return "Afgerond";
  if(st==="busy")return "Bezig";
  return "Te doen";
}

function isLogRead(id){
  return readIds.indexOf(id)!==-1;
}

function getUnreadCount(){
  return L.filter(function(item){return !isLogRead(item.id)}).length;
}

function saveReadIds(){
  try{localStorage.setItem(READ_KEY,JSON.stringify(readIds))}catch(e){}
  if(!currentUser||!/^https?:\/\//i.test(READ_API))return;
  fetch(READ_API,{
    method:"POST",
    cache:"no-store",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({user:currentUser,readIds:readIds})
  }).catch(function(){});
}

function loadReadIds(){
  if(!currentUser||!/^https?:\/\//i.test(READ_API))return;
  fetch(READ_API+"?user="+encodeURIComponent(currentUser)+"&_t="+Date.now(),{
    cache:"no-store"
  }).then(function(res){
    return res.ok?res.json():null;
  }).then(function(data){
    if(data&&Array.isArray(data.readIds)){
      var merged=readIds.slice();
      data.readIds.forEach(function(id){
        if(merged.indexOf(id)===-1)merged.push(id);
      });
      readIds=merged;
      try{localStorage.setItem(READ_KEY,JSON.stringify(readIds))}catch(e){}
      render();
    }
  }).catch(function(){});
}

function markLogRead(id){
  if(!id||isLogRead(id))return;
  readIds.push(id);
  if(readIds.length>500)readIds=readIds.slice(-500);
  saveReadIds();
  render();
}

function markAllLogsRead(){
  var changed=false;
  L.forEach(function(item){
    if(item.id&&!isLogRead(item.id)){
      readIds.push(item.id);
      changed=true;
    }
  });
  if(changed){
    if(readIds.length>500)readIds=readIds.slice(-500);
    saveReadIds();
    render();
  }
}

function addChangeLog(description){
  var entry={
    id:Date.now()+"-"+Math.random().toString(36).slice(2,7),
    user:currentUser||"Onbekend",
    at:new Date().toISOString(),
    desc:description
  };
  L.unshift(entry);
  if(L.length>250)L=L.slice(0,250);
  readIds.push(entry.id);
  saveReadIds();
}

function saveLocal(){
  try{
    localStorage.setItem(KEY,JSON.stringify(S));
    localStorage.setItem(LOG_KEY,JSON.stringify(L));
    localStorage.setItem(READ_KEY,JSON.stringify(readIds));
    if(lastUpdatedAt)localStorage.setItem(META_KEY,lastUpdatedAt);
  }catch(e){}
}

function hasSync(){return typeof SYNC_API==="string"&&/^https?:\/\//i.test(SYNC_API.trim())}

function save(){
  lastUpdatedAt=new Date().toISOString();
  saveLocal();
  if(!hasSync()){
    syncStatus="Alleen lokaal opgeslagen (koppel SYNC_API voor gedeelde weergave)";
    return;
  }
  savingInFlight=true;
  syncStatus="Opslaan voor alle gebruikers…";
  fetch(SYNC_API.trim(),{
    method:"POST",
    cache:"no-store",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({binding:SYNC_BINDING,statuses:S,logs:L,updatedAt:lastUpdatedAt})
  }).then(function(res){
    if(!res.ok)throw new Error("HTTP "+res.status);
    return res.json().catch(function(){return {}});
  }).then(function(resp){
    if(resp&&resp.updatedAt){lastUpdatedAt=resp.updatedAt;saveLocal();}
    savingInFlight=false;
    syncStatus="Gedeeld opgeslagen voor iedereen";
    render();
  }).catch(function(){
    savingInFlight=false;
    syncStatus="Lokaal opgeslagen — delen mislukt (controleer SYNC_API)";
    render();
  });
}

function loadSharedStatuses(silent){
  if(!hasSync())return Promise.resolve();
  if(savingInFlight)return Promise.resolve();
  if(!silent){syncStatus="Synchroniseren…";render()}
  var sep=SYNC_API.indexOf("?")===-1?"?":"&";
  return fetch(SYNC_API.trim()+sep+"binding="+encodeURIComponent(SYNC_BINDING)+"&_t="+Date.now(),{
    cache:"no-store"
  }).then(function(res){
    if(!res.ok)throw new Error("HTTP "+res.status);
    return res.json();
  }).then(function(payload){
    if(savingInFlight)return;
    var remote=(payload&&payload.statuses&&typeof payload.statuses==="object")?payload.statuses:payload;
    var remoteLogs=(payload&&Array.isArray(payload.logs))?payload.logs:null;
    var remoteTime=(payload&&payload.updatedAt)?payload.updatedAt:"";
    if(remote&&typeof remote==="object"){
      var localMs=lastUpdatedAt?Date.parse(lastUpdatedAt):0;
      var remoteMs=remoteTime?Date.parse(remoteTime):0;
      if(!remoteMs||!localMs||remoteMs>=localMs){
        var prev=JSON.stringify(S)+"|"+JSON.stringify(L);
        S=remote;
        if(remoteLogs)L=remoteLogs;
        if(remoteTime)lastUpdatedAt=remoteTime;
        saveLocal();
        syncStatus="Gedeelde lijst actueel";
        var next=JSON.stringify(S)+"|"+JSON.stringify(L);
        if(prev!==next)render();
      }else{
        syncStatus="Gedeelde lijst actueel";
      }
    }
  }).catch(function(){
    if(!silent){syncStatus="Lokale lijst actief";render()}
  });
}

function esc(s){return String(s||"").replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function safeUrl(u){return /^https?:\/\//i.test(String(u||""))?u:"https://www.stichtingerm.nl"}
function fmtTime(iso){if(!iso)return"";var d=new Date(iso);if(isNaN(d))return"";return d.toLocaleDateString("nl-NL")+" om "+d.toLocaleTimeString("nl-NL",{hour:"2-digit",minute:"2-digit"})}
function isConfigured(){return ERM_API&&ERM_API.indexOf("PLAK_HIER")===-1&&/^https?:\/\//i.test(ERM_API)}

function setAuthMode(mode){
  authMode=mode;
  document.getElementById("mode-login").classList.toggle("on",mode==="login");
  document.getElementById("mode-register").classList.toggle("on",mode==="register");
  document.getElementById("login-title").textContent=
    mode==="login"?"Inloggen kwaliteitshandboek":"Nieuw account aanmaken";
  document.getElementById("login-sub").textContent=
    mode==="login"
      ?"Log in met je eigen gebruikersnaam en wachtwoord. Je wordt bij elk bezoek opnieuw gevraagd in te loggen."
      :"Kies een persoonlijke gebruikersnaam en wachtwoord. Cloudflare onthoudt dit voor je volgende bezoeken.";
  document.getElementById("login-submit-btn").textContent=
    mode==="login"?"Inloggen":"Account opslaan & doorgaan";
  document.getElementById("password-input").setAttribute(
    "autocomplete",
    mode==="login"?"current-password":"new-password"
  );
  document.getElementById("login-error").textContent="";
}

function syncLoginState(){
  var loginEl=document.getElementById("login-screen");
  var appEl=document.getElementById("app-shell");
  var userBar=document.getElementById("user-bar");
  var loggedUserEl=document.getElementById("logged-user");
  if(!currentUser){
    loginEl.style.display="block";
    appEl.style.display="none";
    userBar.style.display="none";
  }else{
    loginEl.style.display="none";
    appEl.style.display="block";
    userBar.style.display="flex";
    loggedUserEl.textContent=currentUser;
  }
}

function setUserName(name){
  var clean=String(name||"").trim();
  if(!clean)return;
  currentUser=clean;
  syncLoginState();
  render();
  loadSharedStatuses(false);
  loadReadIds();
}

function checkUpdates(data){
  var seen={};
  try{seen=JSON.parse(localStorage.getItem(ERM_SEEN_KEY))||{}}catch(e){}
  var changed={},count=0;
  if(seen.versions){
    (data.richtlijnen||[]).forEach(function(r){
      var sig=r.versie+"|"+r.datum;
      if(seen.versions[r.code]&&seen.versions[r.code]!==sig){changed[r.code]=true;count++}
    });
  }
  if(seen.urls){
    (data.nieuws||[]).forEach(function(n){
      if(n.relevant&&seen.urls.indexOf(n.url)===-1)count++;
    });
  }
  ermState.changedCodes=changed;
  ermState.newCount=count;
}

function markErmSeen(){
  if(!ermState.data)return;
  var versions={};
  (ermState.data.richtlijnen||[]).forEach(function(r){versions[r.code]=r.versie+"|"+r.datum});
  var urls=(ermState.data.nieuws||[]).map(function(n){return n.url});
  try{localStorage.setItem(ERM_SEEN_KEY,JSON.stringify({versions:versions,urls:urls}))}catch(e){}
  ermState.newCount=0;
}

function loadErm(force){
  if(!isConfigured())return;
  if(ermState.loading)return;
  ermState.loading=true;ermState.error=null;ermState.offline=false;
  if(currentUser&&view=="k"&&ar===0)render();
  var sep=force?"?refresh=1&":"?";
  var url=ERM_API.replace(/\/+$/,"")+sep+"_t="+Date.now();
  fetch(url,{cache:"no-store"}).then(function(res){
    return res.json().catch(function(){return {}}).then(function(data){
      if(!res.ok)throw new Error((data&&data.error)||("HTTP "+res.status));
      return data;
    });
  }).then(function(data){
    if(data&&data.error)throw new Error(data.detail?(data.error+" ("+data.detail+")"):data.error);
    ermState.data=data;
    ermState.loading=false;
    ermState.offline=false;
    try{localStorage.setItem(ERM_CACHE_KEY,JSON.stringify(data))}catch(e){}
    checkUpdates(data);
    if(currentUser&&view=="k"&&ar===0)markErmSeen();
    if(currentUser)render();
  }).catch(function(err){
    ermState.loading=false;
    ermState.offline=!!ermState.data;
    var msg=err&&err.message?err.message:"Kan nu geen live verbinding maken met Stichting ERM.";
    ermState.error=msg;
    if(currentUser)render();
  });
}

function sid(i,j){return "cobalt-"+i+"-"+j}
function findTaskBySid(taskSid){
  var m=/^cobalt-(\d+)-(\d+)$/.exec(String(taskSid||""));
  if(!m)return null;
  var i=+m[1],j=+m[2];
  if(!D[i]||!D[i].t[j])return null;
  return {chapter:D[i].c,task:D[i].t[j]};
}
function cnt(i){var r={done:0,busy:0,todo:0};D[i].t.forEach(function(_,j){r[S[sid(i,j)]||"todo"]++});return r}
function pie(r,n){if(!n)return "var(--paper)";var a=r.done/n*100,b=a+r.busy/n*100;return "conic-gradient(var(--done) 0 "+a+"%,var(--busy) "+a+"% "+b+"%,var(--todo) "+b+"% 100%)"}
function lg(r){return '<span><i class="dot" style="background:var(--done)"></i>'+r.done+' afgerond</span><span><i class="dot" style="background:var(--busy)"></i>'+r.busy+' bezig</span><span><i class="dot" style="background:var(--todo)"></i>'+r.todo+' te doen</span>'}

function nav(){
  var nb=ermState.newCount>0?'<span class="badge">'+ermState.newCount+' nieuw</span>':"";
  var unread=getUnreadCount();
  var lb=unread>0?'<span class="badge">'+unread+'</span>':"";
  document.getElementById("nav").innerHTML=[
    ["d","Dashboard"],
    ["a","1 · Afvinklijst"],
    ["k","2 · Kenniscentrum"+nb],
    ["w","3 · Wijzigingen"+lb]
  ].map(function(x){
    return '<button data-v="'+x[0]+'" class="'+(view==x[0]?"on":"")+'">'+x[1]+'</button>';
  }).join("");
}

function dash(){var T={done:0,busy:0,todo:0},n=0;D.forEach(function(_,i){var r=cnt(i);for(var k in r){T[k]+=r[k];n+=r[k]}});
var p=n?Math.round(T.done/n*100):0;
var syncInfo=syncStatus?'<div class="sub" style="margin-bottom:14px">'+esc(syncStatus)+'</div>':"";
return syncInfo+'<div class="sum"><div><div class="big">'+p+'%</div><div class="mic" style="margin-top:6px">van het handboek afgerond</div></div>'+
[["done","Afgerond"],["busy","Bezig"],["todo","Te doen"]].map(function(x){return '<div class="it"><b>'+T[x[0]]+'</b><span><i class="dot" style="background:var(--'+x[0]+')"></i>'+x[1]+'</span></div>'}).join("")+'</div>'+
'<div class="dg">'+D.map(function(d,i){var r=cnt(i),m=d.t.length;return '<button class="dc" data-c="'+i+'"><h3 class="h2">'+d.c+'</h3><div class="row"><div class="pie" style="background:'+pie(r,m)+'"></div><div class="lg">'+lg(r)+'</div></div><span class="go">Naar afvinklijst →</span></button>'}).join("")+'</div>'+
'<button class="rs'+(rsArmed?' armed':'')+'" id="rs">'+(rsArmed?'Zeker weten? Klik nogmaals om alles te resetten':'Alle statussen terugzetten')+'</button>'}

function chk(){var d=D[ch],r=cnt(ch);
var m='<div class="menu">'+D.map(function(x,i){var q=cnt(i);return '<button data-c="'+i+'" class="'+(i==ch?"on":"")+'">'+x.c+'<small>'+q.done+' / '+x.t.length+' afgerond</small></button>'}).join("")+'</div>';
var subTxt=r.done+' afgerond · '+r.busy+' bezig · '+r.todo+' te doen'+(syncStatus?' · '+syncStatus:'');
return '<div class="lay">'+m+'<div class="main"><h2 class="h2">'+d.c+'</h2><p class="sub">'+esc(subTxt)+'</p>'+
d.t.map(function(t,j){var s=S[sid(ch,j)]||"todo";return '<div class="ci '+(s=="done"?"done":"")+'"><select data-s="'+sid(ch,j)+'" style="border-color:'+(s=="done"?"var(--done)":s=="busy"?"var(--busy)":"#111")+'"><option value="todo"'+(s=="todo"?" selected":"")+'>Te doen</option><option value="busy"'+(s=="busy"?" selected":"")+'>Bezig</option><option value="done"'+(s=="done"?" selected":"")+'>Afgerond</option></select><div><span class="no">Taak '+String(j+1).padStart(2,"0")+'</span><span class="tx">'+t+'</span></div></div>'}).join("")+'</div></div>'}

function wijzigingen(){
  var unread=getUnreadCount();
  var html='<div class="bar"><div><h2 class="h2">Wijzigingenoverzicht</h2><p class="sub" style="margin-bottom:0">Klik op een wijziging om deze als gelezen te markeren ('+unread+' ongelezen)</p></div>'+
    (unread>0?'<button type="button" class="btn" id="mark-all-read">Alles als gelezen markeren</button>':'')+
    '</div>';
  if(!L.length){
    html+='<div class="bl"><span class="tag">Nog geen wijzigingen</span><p>Zodra iemand een status in de afvinklijst aanpast of de statussen reset, verschijnt dat hier met naam en datum.</p></div>';
  }else{
    html+=L.map(function(item){
      var read=isLogRead(item.id);
      return '<div class="log-item '+(read?'read':'unread')+'" data-log-id="'+esc(item.id)+'">'+
        '<div class="log-top"><span>'+(!read?'<span class="log-badge-new">Nieuw</span>':'')+esc(item.user)+'</span><span class="log-date">'+esc(fmtTime(item.at))+'</span></div>'+
        '<div class="log-desc">'+esc(item.desc)+'</div></div>';
    }).join("");
  }
  return html+'<button class="back" data-v="d">← Terug naar dashboard</button>';
}

function ermLive(){
  var st=ermState.loading?"Bezig met ophalen bij Stichting ERM…":
    ermState.data?(ermState.offline?"Offline — laatst opgeslagen controle: ":"Laatst gecontroleerd: ")+fmtTime(ermState.data.checkedAt):
    "Nog niet gecontroleerd";
  var out='<h2 class="h2">Actueel · ERM-updates</h2><div class="bar"><p class="sub" style="margin:0">'+esc(st)+'</p><button class="btn" id="erm-ref">'+(ermState.loading?"Laden…":"↻ Nu controleren")+'</button></div>';
  if(ermState.error){
    out+='<div class="bl"><span class="tag">Melding</span><p>'+esc(ermState.error)+(ermState.offline?' Hieronder staan de laatst opgeslagen gegevens.':' Controleer je internetverbinding of Worker.')+'</p></div>';
  }
  if(ermState.data){
    var rl=ermState.data.richtlijnen||[];
    out+='<div class="sec">Actuele richtlijnen &amp; monumenten (via stichtingerm.nl)</div><div class="rg">'+
      rl.map(function(r){
        var isNew=ermState.changedCodes[r.code];
        return '<div class="rc"><span class="tag inv">'+esc(r.code)+'</span>'+(isNew?'<span class="tag new">Nieuwe versie</span>':'')+
          '<h4>'+esc(r.naam)+'</h4><div class="meta">'+esc(r.versie)+' · '+esc(r.datum)+'</div>'+
          '<a href="'+esc(safeUrl(r.url))+'" target="_blank" rel="noopener">Bekijk richtlijn op ERM →</a></div>';
      }).join("")+'</div>';

    var allNews=ermState.data.nieuws||[];
    var relNews=allNews.filter(function(n){return n.relevant});
    var list=ermFilter=="rel"?relNews:allNews;

    out+='<div class="bar"><div class="sec" style="margin:0">Laatste ERM-nieuws</div><div class="tabs">'+
      '<button class="btn'+(ermFilter=="rel"?" on":"")+'" data-ef="rel">Schilderwerk &amp; richtlijnen ('+relNews.length+')</button>'+
      '<button class="btn'+(ermFilter=="all"?" on":"")+'" data-ef="all">Al het ERM-nieuws ('+allNews.length+')</button></div></div>';

    if(!list.length){
      out+='<div class="bl"><p>Geen specifieke berichten over schilderwerk gevonden in het meest recente ERM-nieuws. Klik op <b>Al het ERM-nieuws</b> om alle algemene berichten te zien.</p></div>';
    }else{
      out+=list.map(function(n){
        return '<div class="bl'+(n.relevant?" e":"")+'"><span class="tag">'+(n.datum?esc(n.datum):"Actueel")+'</span>'+
          (n.relevant?'<span class="tag">Relevant</span>':'')+
          '<h4>'+esc(n.titel)+'</h4><a href="'+esc(safeUrl(n.url))+'" target="_blank" rel="noopener">Lees bericht op Stichting ERM →</a></div>';
      }).join("");
    }
  }
  return out+'<button class="back" data-v="a">← Terug naar afvinklijst</button>';
}

function kc(){var a=K[ar];
var m='<div class="menu">'+K.map(function(x,i){
  var sub=x.live?'<small>'+(ermState.newCount>0?ermState.newCount+' nieuwe update(s)':'Live van Stichting ERM')+'</small>':"";
  return '<button data-a="'+i+'" class="'+(i==ar?"on":"")+'">'+x.n+sub+'</button>';
}).join("")+'</div>';
if(a.live){return '<div class="lay">'+m+'<div class="main">'+ermLive()+'</div></div>'}
return '<div class="lay">'+m+'<div class="main"><h2 class="h2">'+a.n+'</h2><p class="sub">Algemene uitleg over monumentaal schilderwerk</p>'+
a.b.map(function(b,i){return '<div class="bl '+b[0]+'" id="bl-'+i+'"><span class="tag">'+(b[0]=="e"?"Eis":"Toelichting")+'</span><h4>'+b[1]+'</h4><p>'+b[2]+'</p></div>'}).join("")+
'<button class="back" data-v="a">← Terug naar afvinklijst</button></div></div>'}

function render(){
  if(!currentUser){syncLoginState();return;}
  syncLoginState();
  nav();
  document.getElementById("v").innerHTML=view=="d"?dash():view=="a"?chk():view=="w"?wijzigingen():kc();
}
function go(v){rsArmed=false;clearTimeout(rsTimer);view=v;if(v=="k"&&ar===0)markErmSeen();render();loadSharedStatuses(true);loadReadIds();window.scrollTo(0,0)}

document.getElementById("mode-login").addEventListener("click",function(){setAuthMode("login")});
document.getElementById("mode-register").addEventListener("click",function(){setAuthMode("register")});

document.getElementById("login-form").addEventListener("submit",function(e){
  e.preventDefault();
  var userInp=document.getElementById("username-input");
  var passInp=document.getElementById("password-input");
  var errEl=document.getElementById("login-error");
  var btn=document.getElementById("login-submit-btn");

  var username=String(userInp.value||"").trim();
  var password=String(passInp.value||"");

  if(!username||!password){
    errEl.textContent="Vul zowel je gebruikersnaam als wachtwoord in.";
    return;
  }

  errEl.textContent="";
  btn.disabled=true;
  btn.textContent="Bezig met controleren…";

  fetch(AUTH_API,{
    method:"POST",
    cache:"no-store",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      mode:authMode,
      username:username,
      password:password
    })
  }).then(function(res){
    return res.json().catch(function(){return {}}).then(function(data){return {ok:res.ok,data:data}});
  }).then(function(result){
    btn.disabled=false;
    setAuthMode(authMode);
    if(!result.ok||!result.data||!result.data.ok){
      errEl.textContent=(result.data&&result.data.error)||"Inloggen mislukt.";
      return;
    }
    passInp.value="";
    setUserName(result.data.username);
  }).catch(function(){
    btn.disabled=false;
    setAuthMode(authMode);
    errEl.textContent="Kan geen verbinding maken met Cloudflare. Controleer je internet.";
  });
});

document.getElementById("change-user").addEventListener("click",function(){
  currentUser="";
  readIds=[];
  try{localStorage.removeItem(READ_KEY)}catch(e){}
  syncLoginState();
  document.getElementById("username-input").value="";
  document.getElementById("password-input").value="";
  document.getElementById("login-error").textContent="";
  setAuthMode("login");
  setTimeout(function(){document.getElementById("username-input").focus()},20);
});

document.addEventListener("click",function(e){
  var logEl=e.target.closest(".log-item[data-log-id]");
  if(logEl){
    markLogRead(logEl.dataset.logId);
    return;
  }
  var t=e.target.closest("button");if(!t)return;var d=t.dataset;
  if(t.id=="mark-all-read")return markAllLogsRead();
  if(t.id=="home")return go("d");
  if(t.id=="erm-ref"){loadSharedStatuses(false);loadReadIds();return loadErm(true)}
  if(t.id=="rs"){
    if(rsArmed){
      clearTimeout(rsTimer);rsArmed=false;S={};
      try{localStorage.removeItem(KEY)}catch(err){}
      addChangeLog("Alle statussen teruggezet naar 'Te doen'.");
      save();render();
    }else{
      rsArmed=true;clearTimeout(rsTimer);
      rsTimer=setTimeout(function(){rsArmed=false;if(view=="d")render()},5000);
      render();
    }
    return;
  }
  if(d.ef){ermFilter=d.ef;return render()}
  if(d.v)go(d.v);
  else if(d.c!==undefined){ch=+d.c;go("a")}
  else if(d.a!==undefined){ar=+d.a;go("k")}
});
document.getElementById("home").addEventListener("click",function(){if(currentUser)go("d")});
document.addEventListener("change",function(e){
  var s=e.target.dataset.s;
  if(!s)return;
  var prevStatus=S[s]||"todo";
  var nextStatus=e.target.value;
  if(prevStatus===nextStatus)return;
  S[s]=nextStatus;
  var info=findTaskBySid(s);
  var label=info?(info.chapter+" — "+info.task):s;
  addChangeLog(label+": "+statusLabel(prevStatus)+" → "+statusLabel(nextStatus));
  save();
  render();
});

setAuthMode("login");
syncLoginState();
loadErm(false);

if(hasSync()){
  setInterval(function(){if(document.visibilityState==="visible"&&currentUser){loadSharedStatuses(true);loadReadIds()}},15000);
}

if(isConfigured()){
  setInterval(function(){if(document.visibilityState==="visible"&&currentUser){loadErm(false)}},300000);
  document.addEventListener("visibilitychange",function(){
    if(document.visibilityState==="visible"&&currentUser){
      loadErm(false);
      loadSharedStatuses(true);
      loadReadIds();
    }
  });
}

if("serviceWorker" in navigator){
  window.addEventListener("load",function(){
    navigator.serviceWorker.register("./sw.js").catch(function(){});
  });
}
</script>
