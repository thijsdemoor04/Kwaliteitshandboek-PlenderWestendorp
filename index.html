<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kwaliteitshandboek Monumentaal Schilderwerk</title>
<meta name="theme-color" content="#DDDDDD">
<meta name="color-scheme" content="only light">
<meta name="supported-color-schemes" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kwaliteitshandboek">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="PlenderWestendorp_app-icoon_512.png">
<link rel="apple-touch-icon" href="PlenderWestendorp_app-icoon_512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#DDDDDD;
  --surface:#E5E5E5;
  --surface-elev:#ECECEC;
  --ink:#111;
  --muted:rgba(17,17,17,.68);
  --faint:rgba(17,17,17,.14);
  --line:rgba(17,17,17,.22);
  --hov:rgba(17,17,17,.045);
  --done:#2ecc71;
  --busy:#f39c12;
  --todo:#e74c3c;
  --edge:clamp(18px,3.6vw,64px);
  --serif:'Newsreader',Georgia,serif;
  --sans:Calibri,Carlito,'Segoe UI',system-ui,sans-serif;
  color-scheme:only light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{
  scroll-padding-top:env(safe-area-inset-top,0px);
  background:#DDDDDD !important;
  background-image:linear-gradient(#DDDDDD,#DDDDDD) !important;
}
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:var(--sans);
}
body{
  background:#DDDDDD !important;
  background-image:linear-gradient(#DDDDDD,#DDDDDD) !important;
  color:#111 !important;
  min-height:100vh;
  font-size:16px;
  line-height:1.5;
  forced-color-adjust:none;
}
.wrap{
  max-width:1260px;
  margin:0 auto;
  padding:20px var(--edge) 68px;
}
.serif{
  font-family:var(--serif);
}

/* Logo zonder rand met vloeiende overloop in de achtergrond */
.pw-logo-fade{
  display:block;
  object-fit:contain;
  background:transparent;
  border:0;
  mix-blend-mode:multiply;
  -webkit-mask-image:radial-gradient(ellipse 74% 74% at 50% 50%, #000 52%, rgba(0,0,0,.62) 74%, rgba(0,0,0,0) 100%);
  mask-image:radial-gradient(ellipse 74% 74% at 50% 50%, #000 52%, rgba(0,0,0,.62) 74%, rgba(0,0,0,0) 100%);
}
.hd-brand{
  display:flex;
  align-items:center;
  gap:16px;
}
.hd-logo{
  width:54px;
  height:54px;
  flex:none;
}

/* Moderne headerbalk */
.hd{
  background:var(--surface);
  border:1px solid var(--faint);
  border-radius:14px;
  padding:18px 24px;
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:16px;
  flex-wrap:wrap;
  box-shadow:0 8px 24px rgba(17,17,17,.04);
}
.hd h1{
  font-family:var(--serif);
  font-weight:400;
  font-size:clamp(26px,3.6vw,42px);
  line-height:1.04;
  letter-spacing:-.015em;
  cursor:pointer;
  color:#111;
}
.mic{
  font-size:13px;
  font-weight:700;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--muted);
}
.user-bar{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  margin-top:8px;
  font-size:13px;
  font-weight:600;
  color:#111;
}
.user-link{
  background:none;
  border:0;
  color:#111;
  font-size:12px;
  font-weight:700;
  text-decoration:underline;
  cursor:pointer;
  padding:0;
}
.user-link:hover{
  opacity:.7;
}

/* Moderne navigatiebalk */
nav{
  display:flex;
  gap:8px;
  background:var(--surface);
  border:1px solid var(--faint);
  border-radius:12px;
  padding:6px;
  margin:18px 0 28px;
  flex-wrap:wrap;
}
nav button{
  background:none;
  border:0;
  border-radius:8px;
  padding:10px 18px;
  font-size:14px;
  font-weight:600;
  letter-spacing:.02em;
  color:#111;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:8px;
  transition:background .15s,color .15s;
}
nav button:hover{
  background:var(--hov);
}
nav button.on{
  background:#111 !important;
  background-image:linear-gradient(#111,#111) !important;
  color:#DDDDDD !important;
}
.badge{
  font-size:11px;
  font-weight:700;
  padding:1px 7px;
  border-radius:999px;
  border:1px solid currentColor;
  letter-spacing:.03em;
}
.h2{
  font-family:var(--serif);
  font-weight:400;
  font-size:clamp(22px,2.2vw,32px);
  line-height:1.12;
  letter-spacing:-.01em;
  color:#111;
}

/* Dashboard-kop met Refresh */
.dash-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
  margin-bottom:16px;
}
.dash-refresh-btn{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:9px;
  color:#111;
  font-size:13px;
  font-weight:700;
  padding:8px 15px;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  gap:8px;
  transition:background .15s,border-color .15s;
}
.dash-refresh-btn:hover{
  background:var(--surface-elev);
  border-color:#111;
}

/* Samenvattingsstrook */
.sum{
  background:var(--surface);
  border:1px solid var(--faint);
  border-radius:14px;
  padding:24px 28px;
  display:flex;
  gap:clamp(22px,4vw,56px);
  flex-wrap:wrap;
  align-items:flex-end;
  justify-content:space-between;
  margin-bottom:28px;
}
.sum-left{
  display:flex;
  align-items:baseline;
  gap:18px;
  flex-wrap:wrap;
}
.sum-stats{
  display:flex;
  gap:clamp(20px,3.5vw,44px);
  flex-wrap:wrap;
  align-items:flex-end;
}
.big{
  font-family:var(--serif);
  font-size:clamp(46px,6.5vw,84px);
  line-height:.92;
  letter-spacing:-.02em;
  color:#111;
}
.sum .it b{
  font-family:var(--serif);
  font-weight:400;
  font-size:32px;
  display:block;
  line-height:1.05;
  color:#111;
}
.sum .it span{
  font-size:13.5px;
  font-weight:600;
  display:flex;
  align-items:center;
  gap:7px;
  color:var(--muted);
}
.dot{
  width:11px;
  height:11px;
  border-radius:50%;
  border:1px solid rgba(17,17,17,.35);
  display:inline-block;
}

/* Kaartengrid op het dashboard */
.dg{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(310px,1fr));
  gap:clamp(18px,2.2vw,28px);
}
.dc{
  background:var(--surface);
  border:1px solid var(--faint);
  border-radius:14px;
  padding:20px 22px;
  cursor:pointer;
  text-align:left;
  color:#111;
  font:inherit;
  transition:transform .15s,background .15s,border-color .15s,box-shadow .15s;
}
.dc:hover{
  background:var(--surface-elev);
  border-color:var(--line);
  transform:translateY(-2px);
  box-shadow:0 10px 22px rgba(17,17,17,.06);
}
.dc .row{
  display:flex;
  align-items:center;
  gap:20px;
  margin-top:16px;
}
.pie{
  width:80px;
  height:80px;
  border-radius:50%;
  border:1px solid var(--line);
  flex:none;
}
.lg{
  display:flex;
  flex-direction:column;
  gap:5px;
  font-size:14px;
  font-weight:600;
  color:#111;
}
.lg span{
  display:flex;
  align-items:center;
  gap:8px;
}
.go{
  display:block;
  margin-top:16px;
  padding-top:12px;
  border-top:1px solid var(--faint);
  font-size:13px;
  font-weight:700;
  letter-spacing:.03em;
  color:var(--muted);
}

/* Zijmenu + hoofdvlak */
.lay{
  display:flex;
  gap:clamp(20px,3vw,36px);
  align-items:flex-start;
}
.menu{
  flex:0 0 264px;
  background:var(--surface);
  border:1px solid var(--faint);
  border-radius:14px;
  padding:10px;
  position:sticky;
  top:14px;
}
.menu button{
  display:block;
  width:100%;
  text-align:left;
  background:none;
  border:0;
  border-radius:9px;
  border-bottom:1px solid rgba(17,17,17,.07);
  padding:12px 14px;
  font-size:14px;
  font-weight:600;
  letter-spacing:.02em;
  color:#111;
  cursor:pointer;
  transition:background .15s,padding-left .15s;
}
.menu button:last-child{
  border-bottom:0;
}
.menu button:hover{
  background:var(--hov);
  padding-left:17px;
}
.menu button.on{
  background:#111 !important;
  background-image:linear-gradient(#111,#111) !important;
  color:#DDDDDD !important;
  border-bottom-color:transparent;
}
.menu small{
  display:block;
  font-weight:400;
  font-size:12px;
  opacity:.72;
  margin-top:3px;
}
.main{
  flex:1;
  min-width:0;
  background:var(--surface);
  border:1px solid var(--faint);
  border-radius:14px;
  padding:24px 26px;
}
.main .h2{
  margin-bottom:14px;
}
.sub{
  font-size:14px;
  color:var(--muted);
  margin-bottom:18px;
}
.filter-bar{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  align-items:center;
  margin-bottom:16px;
}
.search-inp{
  padding:9px 14px;
  border:1px solid var(--line);
  border-radius:9px;
  background:var(--surface-elev) !important;
  color:#111 !important;
  font-size:14px;
  min-width:220px;
  flex:1;
  max-width:420px;
  outline:none;
}
.search-inp:focus{
  border-color:#111;
  box-shadow:0 0 0 2px rgba(17,17,17,.08);
}

/* Afvinklijst-regels */
.ci{
  display:flex;
  gap:18px;
  align-items:flex-start;
  padding:14px 10px;
  border-bottom:1px solid var(--faint);
  border-radius:8px;
  flex-wrap:wrap;
}
.ci:last-child{
  border-bottom:0;
}
.ci:hover{
  background:var(--hov);
}
.ci select{
  padding:6px 10px;
  border:1.5px solid #111;
  border-radius:8px;
  background:var(--surface-elev) !important;
  color:#111 !important;
  font-size:14px;
  font-weight:600;
  cursor:pointer;
  width:116px;
  flex:none;
}
.ci.done .tx{
  text-decoration:line-through;
  opacity:.5;
}
.ci-content{
  flex:1;
  min-width:220px;
}
.ci .no{
  font-size:12px;
  font-weight:700;
  letter-spacing:.05em;
  text-transform:uppercase;
  color:var(--muted);
  display:block;
  margin-bottom:2px;
}
.ci .tx{
  font-size:15px;
  color:#111;
}

/* Optioneel notitieblok bij afvinken */
.note-box{
  margin-top:12px;
  padding:14px 16px;
  background:var(--surface-elev);
  border:1px solid var(--line);
  border-radius:10px;
  display:flex;
  flex-direction:column;
  gap:8px;
  max-width:620px;
}
.note-label{
  font-size:13px;
  font-weight:700;
  color:#111;
}
.note-textarea{
  width:100%;
  min-height:76px;
  padding:9px 12px;
  border:1px solid var(--line);
  border-radius:8px;
  background:#DDDDDD !important;
  color:#111 !important;
  font-size:14.5px;
  line-height:1.45;
  resize:vertical;
  outline:none;
}
.note-textarea:focus{
  border-color:#111;
  box-shadow:0 0 0 2px rgba(17,17,17,.08);
}
.note-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  align-items:center;
}

/* Kenniscentrum & ERM-kaarten */
.bl{
  background:var(--surface-elev);
  border:1px solid var(--faint);
  border-radius:12px;
  padding:16px 18px;
  margin-bottom:12px;
  transition:background .15s,border-color .15s;
  cursor:pointer;
}
.bl.hl{
  background:var(--hov);
}
.bl:hover{
  border-color:var(--line);
}
.bl.unread{
  border-left:4px solid #111;
  background:#EFEFEF;
}
.bl.read{
  opacity:.74;
}
.tag{
  display:inline-block;
  font-size:11.5px;
  font-weight:700;
  letter-spacing:.05em;
  text-transform:uppercase;
  padding:2px 8px;
  border-radius:6px;
  border:1px solid var(--line);
  margin-bottom:8px;
  margin-right:6px;
  color:#111;
  background:transparent;
}
.bl.e .tag,.tag.inv{
  background:#111 !important;
  background-image:linear-gradient(#111,#111) !important;
  border-color:#111;
  color:#DDDDDD !important;
}
.tag.new{
  background:var(--busy) !important;
  color:#111 !important;
  border-color:rgba(17,17,17,.35);
}
.item-badge-new{
  display:inline-block;
  font-size:10px;
  font-weight:700;
  letter-spacing:.05em;
  text-transform:uppercase;
  padding:2px 7px;
  border-radius:999px;
  background:#111;
  color:#DDDDDD;
  margin-right:8px;
  vertical-align:middle;
}
.bl h4{
  font-family:var(--serif);
  font-weight:400;
  font-size:21px;
  line-height:1.18;
  margin-bottom:6px;
  color:#111;
}
.bl p{
  font-size:15.5px;
  max-width:72ch;
  color:#111;
}
.bl a{
  color:#111;
  font-size:14px;
  font-weight:700;
  display:inline-block;
  margin-top:10px;
  text-decoration:none;
  border-bottom:1px solid #111;
  padding-bottom:1px;
}
.bl a:hover{
  opacity:.72;
}
.bar{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  align-items:center;
  justify-content:space-between;
  margin-bottom:18px;
}
.bar .h2{
  margin-bottom:0;
}
.tabs{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}
.btn{
  background:var(--surface-elev);
  border:1px solid var(--line);
  border-radius:8px;
  color:#111;
  font-size:13px;
  font-weight:600;
  padding:7px 13px;
  cursor:pointer;
  transition:background .15s,color .15s;
}
.btn:hover{
  background:var(--hov);
}
.btn.on{
  background:#111 !important;
  background-image:linear-gradient(#111,#111) !important;
  border-color:#111;
  color:#DDDDDD !important;
}
.btn-dark{
  background:#111 !important;
  background-image:linear-gradient(#111,#111) !important;
  border:1px solid #111;
  border-radius:8px;
  color:#DDDDDD !important;
  font-size:13px;
  font-weight:700;
  padding:7px 14px;
  cursor:pointer;
}
.btn-dark:hover{
  opacity:.88;
}
.live-btn{
  background:var(--surface-elev);
  border:1px solid var(--line);
  border-radius:8px;
  color:#111;
  font-size:13px;
  font-weight:700;
  padding:7px 13px;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  gap:8px;
}
.live-btn:hover{
  background:var(--hov);
}
.live-lamp{
  width:10px;
  height:10px;
  border-radius:50%;
  border:1px solid rgba(17,17,17,.35);
  display:inline-block;
  background:var(--busy);
}
.live-lamp.is-live{
  background:var(--done);
  box-shadow:0 0 0 3px rgba(46,204,113,.24);
}
.live-lamp.is-err{
  background:var(--todo);
}
.rg{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
  gap:16px;
  margin-bottom:24px;
}
.rc{
  background:var(--surface-elev);
  border:1px solid var(--faint);
  border-radius:12px;
  padding:16px 18px;
}
.rc h4{
  font-family:var(--serif);
  font-weight:400;
  font-size:20px;
  margin:6px 0 4px;
  color:#111;
}
.rc .meta{
  font-size:13.5px;
  font-weight:600;
  color:var(--muted);
}
.rc a{
  color:#111;
  font-size:13px;
  font-weight:700;
  display:inline-block;
  margin-top:10px;
  text-decoration:none;
  border-bottom:1px solid #111;
  padding-bottom:1px;
}
.sec{
  font-size:12.5px;
  font-weight:700;
  letter-spacing:.07em;
  text-transform:uppercase;
  margin:22px 0 12px;
  color:var(--muted);
}
.back{
  margin-top:16px;
  background:var(--surface-elev);
  border:1px solid var(--line);
  border-radius:8px;
  color:#111;
  font-size:13px;
  font-weight:600;
  padding:7px 14px;
  cursor:pointer;
}
.back:hover{
  background:var(--hov);
}
.dash-tools{
  display:flex;
  gap:18px;
  align-items:center;
  flex-wrap:wrap;
  margin-top:36px;
}
.rs{
  background:none;
  border:0;
  font-size:13px;
  color:var(--muted);
  cursor:pointer;
  text-decoration:underline;
}
.rs.armed{
  opacity:1;
  font-weight:700;
  color:var(--todo);
  text-decoration:none;
  border:1.5px solid var(--todo);
  border-radius:8px;
  padding:7px 13px;
}

/* Beginscherm / Inloggen */
.login-wrap{
  max-width:520px;
  margin:36px auto 0;
  background:var(--surface);
  border:1px solid var(--faint);
  border-radius:16px;
  padding:32px;
  box-shadow:0 12px 30px rgba(17,17,17,.05);
}
.login-logo{
  width:92px;
  height:92px;
  margin-bottom:18px;
}
.login-wrap h2{
  font-family:var(--serif);
  font-weight:400;
  font-size:clamp(26px,3.2vw,36px);
  line-height:1.12;
  margin-bottom:18px;
  color:#111;
}
.login-modes{
  display:flex;
  gap:8px;
  margin-bottom:20px;
  flex-wrap:wrap;
}
.login-modes button{
  background:var(--surface-elev);
  border:1px solid var(--line);
  border-radius:8px;
  color:#111;
  font-size:13px;
  font-weight:700;
  padding:7px 13px;
  cursor:pointer;
}
.login-modes button.on{
  background:#111 !important;
  background-image:linear-gradient(#111,#111) !important;
  border-color:#111;
  color:#DDDDDD !important;
}
.login-form{
  display:flex;
  flex-direction:column;
  gap:14px;
}
.login-form label{
  font-size:12.5px;
  font-weight:700;
  letter-spacing:.05em;
  text-transform:uppercase;
  color:#111;
}
.login-form input{
  padding:11px 14px;
  border:1px solid var(--line);
  border-radius:9px;
  background:var(--surface-elev) !important;
  color:#111 !important;
  font-size:16px;
  outline:none;
}
.login-form input:focus{
  border-color:#111;
  box-shadow:0 0 0 2px rgba(17,17,17,.08);
}
.login-err{
  color:#b00020;
  font-size:14px;
  font-weight:700;
  min-height:20px;
}
.login-submit{
  align-self:flex-start;
  background:#111 !important;
  background-image:linear-gradient(#111,#111) !important;
  color:#DDDDDD !important;
  border:1px solid #111;
  border-radius:9px;
  padding:10px 22px;
  font-size:14px;
  font-weight:700;
  letter-spacing:.03em;
  cursor:pointer;
}
.login-submit:hover{
  opacity:.88;
}
.login-submit:disabled{
  opacity:.5;
  cursor:wait;
}

/* Wijzigingenlog */
.log-item{
  background:var(--surface-elev);
  border:1px solid var(--faint);
  border-radius:11px;
  padding:13px 16px;
  margin-bottom:10px;
  display:flex;
  flex-direction:column;
  gap:6px;
  cursor:pointer;
  transition:background .15s,border-color .15s;
}
.log-item:hover{
  border-color:var(--line);
}
.log-item.unread{
  border-left:4px solid #111;
  background:#EFEFEF;
}
.log-item.read{
  opacity:.72;
}
.log-badge-new{
  display:inline-block;
  font-size:10px;
  font-weight:700;
  letter-spacing:.05em;
  text-transform:uppercase;
  padding:2px 7px;
  border-radius:999px;
  background:#111;
  color:#DDDDDD;
  margin-right:8px;
}
.log-top{
  display:flex;
  justify-content:space-between;

var KEY = "cobalt_kwaliteit_status_v4";
var META_KEY = "cobalt_kwaliteit_meta_v2";

var ERM_SEEN_KEY = "cobalt_erm_seen_v1";
var USER_KEY = "cobalt_kwaliteit_user_v1";
var LOG_KEY = "cobalt_kwaliteit_log_v2";
var READ_MAP_KEY = "cobalt_kwaliteit_read_by_user_v1";

var S = {};
var L = [];
var readByUser = {};

var authMode = "login";
var lastUpdatedAt = "";

var ch = 0;
var ar = 0;
var ermFilter = "rel";
var ermQuery = "";
var rsArmed = false;
var rsTimer = null;
var savingInFlight = false;
var dashRefreshing = false;

var pendingTaskNote = null;

var editingLogId = "";

var ermState = {
  loading: false,
  error: null,
  data: null,
  offline: false,
  newCount: 0,
  changedCodes: {}
};

try {
  localStorage.removeItem(USER_KEY);
} catch (e) {}

try {
  S = JSON.parse(localStorage.getItem(KEY)) || {};
} catch (e) {}

try {
  L = JSON.parse(localStorage.getItem(LOG_KEY)) || [];
  if (!Array.isArray(L)) {
    L = [];

} catch (e) {

}

try {

} catch (e) {
  readByUser = {};
}

try {
  lastUpdatedAt = localStorage.getItem(META_KEY) || "";
} catch (e) {}

try {
  ermState.data = JSON.parse(localStorage.getItem(ERM_CACHE_KEY)) || null;
} catch (e) {}

function getUserReadIds(userName) {
  var u = String(userName || "").trim();
  if (!u) {
    return [];
  }
  if (!Array.isArray(readByUser[u])) {
    readByUser[u] = [];
  }
  return readByUser[u];
}

function statusLabel(st) {
  if (st === "done") {
    return "Afgerond";
  }
  if (st === "busy") {
    return "Bezig";
  }
  return "Te doen";
}

function isItemRead(id) {
  if (!id) {
    return true;
  }
  return getUserReadIds(currentUser).indexOf(id) !== -1;
}

function getUnreadCount() {
  return L.filter(function (item) {
    return !isItemRead(item.id);
  }).length;
}

function ermArticleKey(url) {
  return "erm:" + String(url || "").trim();
}

function kcBlockKey(sectionId, index) {
  return "kc:" + String(sectionId || "") + ":" + index;
}

function getRelevantErmNews() {
  if (!ermState.data) {
    return [];
  }
  if (!Array.isArray(ermState.data.nieuws)) {
    return [];
  }
  return ermState.data.nieuws.filter(function (n) {
    return !!n.relevant;
  });
}

function getUnreadRelevantErmCount() {
  return getRelevantErmNews().filter(function (n) {
    return !isItemRead(ermArticleKey(n.url));
  }).length;
}

function getUnreadKcSectionCount(sec) {
  if (!sec || sec.live || !Array.isArray(sec.b)) {
    return 0;
  }
  return sec.b.filter(function (_, idx) {
    return !isItemRead(kcBlockKey(sec.id, idx));
  }).length;
}

function getTotalUnreadKcCount() {
  var total = getUnreadRelevantErmCount();
  K.forEach(function (sec) {
    if (!sec.live) {
      total += getUnreadKcSectionCount(sec);
    }
  });
  return total;
}

function markItemRead(id) {
  if (!id || !currentUser || isItemRead(id)) {
    return;
  }
  var arr = getUserReadIds(currentUser);
  arr.push(id);
  if (arr.length > 2000) {
    readByUser[currentUser] = arr.slice(-2000);
  }
  save();
  render();
}

function markAllKcRead() {
  if (!currentUser) {
    return;
  }
  var arr = getUserReadIds(currentUser);
  var changed = false;
  getRelevantErmNews().forEach(function (n) {
    var key = ermArticleKey(n.url);
    if (n.url && arr.indexOf(key) === -1) {
      arr.push(key);
      changed = true;
    }
  });
  K.forEach(function (sec) {
    if (!sec.live && Array.isArray(sec.b)) {
      sec.b.forEach(function (_, idx) {
        var key = kcBlockKey(sec.id, idx);
        if (arr.indexOf(key) === -1) {
          arr.push(key);
          changed = true;
        }
      });
    }
  });
  if (changed) {
    if (arr.length > 2000) {
      readByUser[currentUser] = arr.slice(-2000);
    }
    save();
    render();
  }
}

function markAllLogsRead() {
  if (!currentUser) {
    return;
  }
  var arr = getUserReadIds(currentUser);
  var changed = false;
  L.forEach(function (item) {
    if (item.id && arr.indexOf(item.id) === -1) {
      arr.push(item.id);
      changed = true;
    }
  });
  if (changed) {
    if (arr.length > 2000) {
      readByUser[currentUser] = arr.slice(-2000);
    }
    save();
    render();
  }
}

function addChangeLog(description, noteText) {
  var cleanNote = String(noteText || "").trim();
  var actor = currentUser || "Onbekend";
  var entry = {
    id: Date.now() + "-" + Math.random().toString(36).slice(2, 7),
    user: actor,
    at: new Date().toISOString(),
    desc: description,
    note: cleanNote
  };
  L.unshift(entry);
  if (L.length > 500) {
    L = L.slice(0, 500);
  }
  var arr = getUserReadIds(actor);
  if (arr.indexOf(entry.id) === -1) {
    arr.push(entry.id);
  }
  return entry.id;
}

function saveTaskWithNote(taskSid) {
  if (!pendingTaskNote || pendingTaskNote.sid !== taskSid) {
    return;
  }
  var nextStatus = pendingTaskNote.nextStatus;
  var prevStatus = pendingTaskNote.prevStatus;
  var noteVal = String(draftNotes[taskSid] || "").trim();

  S[taskSid] = nextStatus;
  var info = findTaskBySid(taskSid);
  var label = info ? (info.chapter + " — " + info.task) : taskSid;
  var newLogId = addChangeLog(label + ": " + statusLabel(prevStatus) + " → " + statusLabel(nextStatus), noteVal);

  delete draftNotes[taskSid];
  pendingTaskNote = null;

  save();
  render();

  if (newLogId && view === "w") {
    var el = document.querySelector('[data-read-id="' + newLogId + '"]');
    if (el) {
      el.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }
  }
}

function cancelTaskNote(taskSid) {
  if (!pendingTaskNote || pendingTaskNote.sid !== taskSid) {
    return;
  }
  delete draftNotes[taskSid];
  pendingTaskNote = null;
  render();
}

function startEditLogNote(logId) {
  var item = L.find(function (x) {
    return x.id === logId;
  });
  if (!item) {
    return;
  }
  editingLogId = logId;
  editingLogDraft = String(item.note || "");
  render();
}

function cancelEditLogNote() {
  editingLogId = "";
  editingLogDraft = "";
  render();
}

function saveEditLogNote(logId) {
  var item = L.find(function (x) {
    return x.id === logId;
  });
  if (!item) {
    return;
  }
  item.note = String(editingLogDraft || "").trim();
  item.editedBy = currentUser || item.user || "Onbekend";
  item.editedAt = new Date().toISOString();
  editingLogId = "";
  editingLogDraft = "";
  save();
  render();
}

function mergeLogs(listA, listB) {
  var map = {};
  var merged = [];
  [].concat(Array.isArray(listA) ? listA : [], Array.isArray(listB) ? listB : []).forEach(function (item) {
    if (!item || !item.id) {
      return;
    }
    if (!map[item.id]) {
      map[item.id] = Object.assign({}, item);
      merged.push(map[item.id]);
    } else {
      var prev = map[item.id];
      var prevEdit = prev.editedAt ? Date.parse(prev.editedAt) : 0;
      var nextEdit = item.editedAt ? Date.parse(item.editedAt) : 0;
      if (nextEdit > prevEdit) {
        map[item.id] = Object.assign({}, prev, item);
      } else if (!prev.note && item.note) {
        map[item.id] = Object.assign({}, prev, { note: item.note });
      }
    }
  });
  merged.sort(function (a, b) {
    return (Date.parse(b.at || 0) || 0) - (Date.parse(a.at || 0) || 0);
  });
  return merged.slice(0, 500);
}

function mergeReadByUser(mapA, mapB) {
  var out = {};
  var sources = [mapA || {}, mapB || {}];
  sources.forEach(function (src) {
    if (!src || typeof src !== "object" || Array.isArray(src)) {
      return;
    }
    Object.keys(src).forEach(function (u) {
      if (!out[u]) {
        out[u] = [];
      }
      var list = Array.isArray(src[u]) ? src[u] : [];
      list.forEach(function (id) {
        if (id && out[u].indexOf(id) === -1) {
          out[u].push(id);
        }
      });
      if (out[u].length > 2000) {
        out[u] = out[u].slice(-2000);
      }
    });
  });
  return out;
}

function saveLocal() {
  try {
    localStorage.setItem(KEY, JSON.stringify(S));
    localStorage.setItem(LOG_KEY, JSON.stringify(L));
    localStorage.setItem(READ_MAP_KEY, JSON.stringify(readByUser));
    if (lastUpdatedAt) {
      localStorage.setItem(META_KEY, lastUpdatedAt);
    }
  } catch (e) {}
}

function hasSync() {
  if (typeof ACCOUNT_DATA_API !== "string") {
    return false;
  }
  return /^https?:\/\//i.test(ACCOUNT_DATA_API.trim());
}

function save(opts) {
  var isReset = !!(opts && opts.reset === true);
  lastUpdatedAt = new Date().toISOString();
  saveLocal();
  if (!hasSync() || !currentUser) {
    return;
  }
  savingInFlight = true;
  fetch(ACCOUNT_DATA_API.trim(), {
    method: "POST",
    cache: "no-store",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      scope: SHARED_SCOPE,
      user: currentUser,
      actor: currentUser,
      reset: isReset,
      statuses: S,
      readByUser: readByUser,
      readIds: getUserReadIds(currentUser),
      logs: L,
      updatedAt: lastUpdatedAt
    })
  })
    .then(function (res) {
      if (!res.ok) {
        throw new Error("HTTP " + res.status);
      }
      return res.json();
    })
    .then(function (resp) {
      if (resp && resp.ok) {
        if (resp.statuses && typeof resp.statuses === "object") {
          S = isReset ? Object.assign({}, resp.statuses) : Object.assign({}, resp.statuses, S);
        }
        if (resp.readByUser && typeof resp.readByUser === "object") {
          readByUser = mergeReadByUser(resp.readByUser, readByUser);
        } else if (Array.isArray(resp.readIds) && currentUser) {
          var tmp = {};
          tmp[currentUser] = resp.readIds;
          readByUser = mergeReadByUser(tmp, readByUser);
        }
        if (Array.isArray(resp.logs)) {
          L = mergeLogs(resp.logs, L);
        }
        if (resp.updatedAt) {
          lastUpdatedAt = resp.updatedAt;
        }
        saveLocal();
      }
      savingInFlight = false;
      render();
    })
    .catch(function () {
      savingInFlight = false;
      render();
    });
}

function loadAccountData(forceRender) {
  if (!hasSync() || !currentUser || savingInFlight) {
    return Promise.resolve();
  }
  var sep = ACCOUNT_DATA_API.indexOf("?") === -1 ? "?" : "&";
  var url = ACCOUNT_DATA_API.trim() + sep +
    "scope=" + encodeURIComponent(SHARED_SCOPE) +
    "&shared=1" +
    "&actor=" + encodeURIComponent(currentUser) +
    "&_t=" + Date.now();

  return fetch(url, { cache: "no-store" })
    .then(function (res) {
      if (!res.ok) {
        throw new Error("HTTP " + res.status);
      }
      return res.json();
    })
    .then(function (payload) {
      if (savingInFlight || !payload || !payload.ok) {
        return;
      }
      var remoteStatuses = (payload.statuses && typeof payload.statuses === "object") ? payload.statuses : {};
      var remoteLogs = Array.isArray(payload.logs) ? payload.logs : [];
      var remoteTime = payload.updatedAt || "";

      var prevS = JSON.stringify(S);
      var prevL = JSON.stringify(L);
      var prevR = JSON.stringify(readByUser);

      if (remoteStatuses && typeof remoteStatuses === "object") {
        S = Object.assign({}, remoteStatuses);
      }

      if (remoteLogs.length > 0) {
        L = mergeLogs(remoteLogs, L);
      }

      if (payload.readByUser && typeof payload.readByUser === "object") {
        readByUser = mergeReadByUser(payload.readByUser, readByUser);
      } else if (Array.isArray(payload.readIds) && currentUser) {
        var tmp = {};
        tmp[currentUser] = payload.readIds;
        readByUser = mergeReadByUser(tmp, readByUser);
      }

      if (remoteTime) {
        lastUpdatedAt = remoteTime;
      }

      saveLocal();

      if (forceRender || prevS !== JSON.stringify(S) || prevL !== JSON.stringify(L) || prevR !== JSON.stringify(readByUser)) {
        render();
      }
    })
    .catch(function () {});
}

function refreshDashboardInPlace() {
  if (!currentUser) {
    return;
  }
  view = "d";
  rsArmed = false;
  clearTimeout(rsTimer);
  pendingTaskNote = null;
  editingLogId = "";
  dashRefreshing = true;
  render();

  var tasks = [loadAccountData(true)];
  if (isConfigured()) {
    tasks.push(loadErm(false));
  }
  Promise.all(tasks).finally(function () {
    dashRefreshing = false;
    render();
  });
}

function esc(s) {
  return String(s || "").replace(/[&<>"']/g, function (c) {
    return {
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    }[c];
  });
}

function safeUrl(u) {
  if (/^https?:\/\//i.test(String(u || ""))) {
    return u;
  }
  return "https://www.stichtingerm.nl";
}

function fmtTime(iso) {
  if (!iso) {
    return "";
  }
  var d = new Date(iso);
  if (isNaN(d)) {
    return "";
  }
  return d.toLocaleDateString("nl-NL") + " om " + d.toLocaleTimeString("nl-NL", { hour: "2-digit", minute: "2-digit" });
}

function isConfigured() {
  if (!ERM_API) {
    return false;
  }
  if (ERM_API.indexOf("PLAK_HIER") !== -1) {
    return false;
  }
  return /^https?:\/\//i.test(ERM_API);
}

function setAuthMode(mode) {
  authMode = mode;
  document.getElementById("mode-login").classList.toggle("on", mode === "login");
  document.getElementById("mode-register").classList.toggle("on", mode === "register");
  document.getElementById("login-title").textContent =
    mode === "login" ? "Inloggen kwaliteitshandboek" : "Nieuw account aanmaken";
  document.getElementById("login-submit-btn").textContent =
    mode === "login" ? "Inloggen" : "Account opslaan & doorgaan";
  document.getElementById("password-input").setAttribute(
    "autocomplete",
    mode === "login" ? "current-password" : "new-password"
  );
  document.getElementById("login-error").textContent = "";
}

function syncLoginState() {
  var loginEl = document.getElementById("login-screen");
  var appEl = document.getElementById("app-shell");
  var userBar = document.getElementById("user-bar");
  var loggedUserEl = document.getElementById("logged-user");
  if (!currentUser) {
    loginEl.style.display = "block";
    appEl.style.display = "none";
    userBar.style.display = "none";
  } else {
    loginEl.style.display = "none";
    appEl.style.display = "block";
    userBar.style.display = "flex";
    loggedUserEl.textContent = currentUser;
  }
}

function setUserName(name) {
  var clean = String(name || "").trim();
  if (!clean) {
    return;
  }
  currentUser = clean;
  getUserReadIds(currentUser);
  syncLoginState();
  render();
  loadAccountData(true);
}

function checkUpdates(data) {
  var seen = {};
  try {
    seen = JSON.parse(localStorage.getItem(ERM_SEEN_KEY)) || {};
  } catch (e) {}
  var changed = {};
  var count = 0;
  if (seen.versions) {
    (data.richtlijnen || []).forEach(function (r) {
      var sig = r.versie + "|" + r.datum;
      if (seen.versions[r.code] && seen.versions[r.code] !== sig) {
        changed[r.code] = true;
        count++;
      }
    });
  }
  ermState.changedCodes = changed;
  ermState.newCount = count;
}

function markErmSeen() {
  if (!ermState.data) {
    return;
  }
  var versions = {};
  (ermState.data.richtlijnen || []).forEach(function (r) {
    versions[r.code] = r.versie + "|" + r.datum;
  });
  var urls = (ermState.data.nieuws || []).map(function (n) {
    return n.url;
  });
  try {
    localStorage.setItem(ERM_SEEN_KEY, JSON.stringify({ versions: versions, urls: urls }));
  } catch (e) {}
  ermState.newCount = 0;
}

function loadErm(force) {
  if (!isConfigured()) {
    return Promise.resolve();
  }
  if (ermState.loading) {
    return Promise.resolve();
  }
  ermState.loading = true;
  ermState.error = null;
  ermState.offline = false;
  if (currentUser && view == "k" && ar === 0) {
    render();
  }
  var sep = force ? "?refresh=1&" : "?";
  var url = ERM_API.replace(/\/+$/, "") + sep + "_t=" + Date.now();
  return fetch(url, { cache: "no-store" })
    .then(function (res) {
      return res.json().catch(function () {
        return {};
      }).then(function (data) {
        if (!res.ok) {
          throw new Error((data && data.error) || ("HTTP " + res.status));
        }
        return data;
      });
    })
    .then(function (data) {
      if (data && data.error) {
        throw new Error(data.detail ? (data.error + " (" + data.detail + ")") : data.error);
      }
      ermState.data = data;
      ermState.loading = false;
      ermState.offline = false;
      try {
        localStorage.setItem(ERM_CACHE_KEY, JSON.stringify(data));
      } catch (e) {}
      checkUpdates(data);
      if (currentUser && view == "k" && ar === 0) {
        markErmSeen();
      }
      if (currentUser) {
        render();
      }
    })
    .catch(function (err) {
      ermState.loading = false;
      ermState.offline = !!ermState.data;
      var msg = err && err.message ? err.message : "Kan nu geen live verbinding maken met Stichting ERM.";
      ermState.error = msg;
      if (currentUser) {
        render();
      }
    });
}

function sid(i, j) {
  return "cobalt-" + i + "-" + j;
}

function findTaskBySid(taskSid) {
  var m = /^cobalt-(\d+)-(\d+)$/.exec(String(taskSid || ""));
  if (!m) {
    return null;
  }
  var i = +m[1];
  var j = +m[2];
  if (!D[i] || !D[i].t[j]) {
    return null;
  }
  return { chapter: D[i].c, task: D[i].t[j] };
}

function cnt(i) {
  var r = { done: 0, busy: 0, todo: 0 };
  D[i].t.forEach(function (_, j) {
    r[S[sid(i, j)] || "todo"]++;
  });
  return r;
}

function pie(r, n) {
  if (!n) {
    return "var(--paper)";
  }
  var a = r.done / n * 100;
  var b = a + r.busy / n * 100;
  return "conic-gradient(var(--done) 0 " + a + "%,var(--busy) " + a + "% " + b + "%,var(--todo) " + b + "% 100%)";
}

function lg(r) {
  return '<span><i class="dot" style="background:var(--done)"></i>' + r.done + ' afgerond</span>' +
    '<span><i class="dot" style="background:var(--busy)"></i>' + r.busy + ' bezig</span>' +
    '<span><i class="dot" style="background:var(--todo)"></i>' + r.todo + ' te doen</span>';
}

function nav() {
  var unreadKc = getTotalUnreadKcCount() + ermState.newCount;
  var nb = unreadKc > 0 ? '<span class="badge">' + unreadKc + '</span>' : "";
  var unread = getUnreadCount();
  var lb = unread > 0 ? '<span class="badge">' + unread + '</span>' : "";
  document.getElementById("nav").innerHTML = [
    ["d", "Dashboard"],
    ["a", "1 · Afvinklijst"],
    ["k", "2 · Kenniscentrum" + nb],
    ["w", "3 · Wijzigingen" + lb]
  ].map(function (x) {
    return '<button data-v="' + x[0] + '" class="' + (view == x[0] ? "on" : "") + '">' + x[1] + '</button>';
  }).join("");
}

function dash() {
  var T = { done: 0, busy: 0, todo: 0 };
  var n = 0;
  D.forEach(function (_, i) {
    var r = cnt(i);
    for (var k in r) {
      T[k] += r[k];
      n += r[k];
    }
  });
  var p = n ? Math.round(T.done / n * 100) : 0;
  return '<div class="dash-head"><h2 class="h2">Dashboard</h2>' +
    '<button type="button" class="dash-refresh-btn" id="dash-refresh">' + (dashRefreshing ? 'Verversen…' : 'Refresh') + '</button></div>' +
    '<div class="sum"><div class="sum-left"><div class="big">' + p + '%</div><div class="mic">van het handboek afgerond</div></div>' +
    '<div class="sum-stats">' +
    [["done", "Afgerond"], ["busy", "Bezig"], ["todo", "Te doen"]].map(function (x) {
      return '<div class="it"><b>' + T[x[0]] + '</b><span><i class="dot" style="background:var(--' + x[0] + ')"></i>' + x[1] + '</span></div>';
    }).join("") +
    '</div></div>' +
    '<div class="dg">' + D.map(function (d, i) {
      var r = cnt(i);
      var m = d.t.length;
      return '<button class="dc" data-c="' + i + '"><h3 class="h2">' + d.c + '</h3><div class="row"><div class="pie" style="background:' + pie(r, m) + '"></div><div class="lg">' + lg(r) + '</div></div><span class="go">Naar afvinklijst →</span></button>';
    }).join("") + '</div>' +
    '<div class="dash-tools">' +
    '<button class="rs' + (rsArmed ? ' armed' : '') + '" id="rs">' + (rsArmed ? 'Zeker weten? Klik nogmaals om alles te resetten' : 'Alle statussen terugzetten') + '</button></div>';
}

function chk() {

  var m = '<div class="menu">' + D.map(function (x, i) {
    var q = cnt(i);
    return '<button data-c="' + i + '" class="' + (i == ch ? "on" : "") + '">' + x.c + '<small>' + q.done + ' / ' + x.t.length + ' afgerond</small></button>';
  }).join("") + '</div>';
  var rowsHtml = d.t.map(function (t, j) {
    var itemSid = sid(ch, j);

    var currentDraft = isPending ? (draftNotes[itemSid] || "") : "";

    var noteHtml = isPending
      ? '<div class="note-box">' +
        '<div class="note-label">Notitie</div>' +
        '<textarea class="note-textarea" data-note-input="' + esc(itemSid) + '">' + esc(currentDraft) + '</textarea>' +
        '<div class="note-actions">' +
        '<button type="button" class="btn-dark" data-save-note="' + esc(itemSid) + '">Opslaan</button>' +
        '<button type="button" class="btn" data-cancel-note="' + esc(itemSid) + '">Annuleren</button>' +
        '</div></div>'
      : '';

      '<option value="todo"' + (s == "todo" ? " selected" : "") + '>Te doen</option>' +
      '<option value="busy"' + (s == "busy" ? " selected" : "") + '>Bezig</option>' +

      '</select><div class="ci-content"><span class="no">Taak ' + String(j + 1).padStart(2, "0") + '</span><span class="tx">' + t + '</span>' + noteHtml + '</div></div>';
  }).join("");
  return '<div class="lay">' + m + '<div class="main"><h2 class="h2">' + d.c + '</h2>' + rowsHtml + '</div></div>';

function ermLive() {
  var isLiveOk = !ermState.loading && !ermState.error && !!ermState.data && !ermState.offline;
  var lampClass = ermState.loading ? "" : (isLiveOk ? " is-live" : (ermState.error ? " is-err" : ""));
  var liveLabel = ermState.loading ? "Verversen…" : (isLiveOk ? "Live · Up-to-date" : (ermState.offline ? "Offline (cache)" : "Controleren"));

  var totalUnreadKc = getTotalUnreadKcCount();
  var out = '<div class="bar"><h2 class="h2">Actueel · ERM-updates</h2>' +
    '<div class="tabs"><button type="button" class="live-btn" id="erm-ref" title="Klik om nu live te refreshen"><i class="live-lamp' + lampClass + '"></i><span>' + esc(liveLabel) + '</span></button>' +
    (totalUnreadKc > 0 ? '<button type="button" class="btn" id="mark-all-kc-read">Alles als gelezen markeren</button>' : '') +
    '</div></div>';

  if (ermState.error) {
    out += '<div class="bl read"><span class="tag">Melding</span><p>' + esc(ermState.error) + (ermState.offline ? ' Hieronder staan de laatst opgeslagen gegevens.' : ' Controleer je internetverbinding of Worker.') + '</p></div>';
  }
  if (ermState.data) {
    var rl = ermState.data.richtlijnen || [];
    out += '<div class="sec">Actuele richtlijnen (URL 4009, URL 2004 &amp; BRL 4000)</div><div class="rg">' +
      rl.map(function (r) {
        var isNew = ermState.changedCodes[r.code];
        return '<div class="rc"><span class="tag inv">' + esc(r.code) + '</span>' + (isNew ? '<span class="tag new">Nieuwe versie</span>' : '') +
          '<h4>' + esc(r.naam) + '</h4><div class="meta">' + esc(r.versie) + ' · ' + esc(r.datum) + '</div>' +
          '<a href="' + esc(safeUrl(r.url)) + '" target="_blank" rel="noopener">Bekijk richtlijn op ERM →</a></div>';
      }).join("") + '</div>';

    var allNews = ermState.data.nieuws || [];
    var relNews = getRelevantErmNews();
    var unreadRelNews = relNews.filter(function (n) {
      return !isItemRead(ermArticleKey(n.url));
    });
    var baseList = ermFilter == "unread" ? unreadRelNews : (ermFilter == "all" ? allNews : relNews);
    var q = ermQuery.trim().toLowerCase();
    var list = q ? baseList.filter(function (n) {
      var inTitle = String(n.titel || "").toLowerCase().indexOf(q) !== -1;
      var inTopics = Array.isArray(n.topics) && n.topics.some(function (tp) {
        return String(tp).toLowerCase().indexOf(q) !== -1;
      });
      var inDate = String(n.datum || "").toLowerCase().indexOf(q) !== -1;
      return inTitle || inTopics || inDate;
    }) : baseList;

    out += '<div class="bar"><div class="sec" style="margin:0">BRL 4000 en URL 4009 / 2004 (' + unreadRelNews.length + ' ongelezen)</div><div class="tabs">' +
      '<button class="btn' + (ermFilter == "rel" ? " on" : "") + '" data-ef="rel">BRL 4000 en URL 4009 / 2004 (' + relNews.length + ')</button>' +
      '<button class="btn' + (ermFilter == "unread" ? " on" : "") + '" data-ef="unread">Ongelezen (' + unreadRelNews.length + ')</button>' +
      '<button class="btn' + (ermFilter == "all" ? " on" : "") + '" data-ef="all">Al het ERM-nieuws (' + allNews.length + ')</button>' +
      '</div></div>';

    out += '<div class="filter-bar"><input type="search" class="search-inp" id="erm-search" value="' + esc(ermQuery) + '" placeholder="Zoek op BRL 4000, URL 4009, URL 2004, kleurhistorisch onderzoek, schilderwerk…"></div>';

    if (!list.length) {
      out += '<div class="bl read"><p>' + (ermFilter == "unread" ? 'Alle berichten onder BRL 4000 en URL 4009 / 2004 zijn als gelezen gemarkeerd.' : 'Geen berichten gevonden binnen dit filter.') + '</p></div>';
    } else {
      out += list.map(function (n) {
        var read = isItemRead(ermArticleKey(n.url));
        var topicTags = Array.isArray(n.topics) && n.topics.length
          ? n.topics.slice(0, 3).map(function (tp) {
            return '<span class="tag">' + esc(tp) + '</span>';
          }).join("")
          : (n.relevant ? '<span class="tag">BRL 4000 / URL 4009 &amp; 2004</span>' : '');
        return '<div class="bl' + (n.relevant ? " e" : "") + ' ' + (read ? "read" : "unread") + '" data-read-id="' + esc(ermArticleKey(n.url)) + '">' +
          '<div class="log-top"><span>' + (!read ? '<span class="item-badge-new">Nieuw</span>' : '') +
          '<span class="tag">' + (n.datum ? esc(n.datum) : "Actueel") + '</span>' +
          topicTags + '</span></div>' +
          '<h4>' + esc(n.titel) + '</h4>' +
          '<a href="' + esc(safeUrl(n.url)) + '" target="_blank" rel="noopener">Lees bericht op Stichting ERM →</a>' +
          '</div>';
      }).join("");
    }
  }
  return out + '<button class="back" data-v="a">← Terug naar afvinklijst</button>';
}

function kc() {
  if (ar < 0 || ar >= K.length) {
    ar = 0;
  }
  var a = K[ar];
  var totalUnreadKc = getTotalUnreadKcCount();
  var m = '<div class="menu">' + K.map(function (x, i) {
    var u = x.live ? getUnreadRelevantErmCount() : getUnreadKcSectionCount(x);
    var sub = u > 0 ? '<small>' + u + ' ongelezen</small>' : '';
    return '<button data-a="' + i + '" class="' + (i == ar ? "on" : "") + '">' + x.n + sub + '</button>';
  }).join("") + '</div>';
  if (a.live) {
    return '<div class="lay">' + m + '<div class="main">' + ermLive() + '</div></div>';
  }
  return '<div class="lay">' + m + '<div class="main"><div class="bar"><h2 class="h2">' + a.n + '</h2>' +
    (totalUnreadKc > 0 ? '<button type="button" class="btn" id="mark-all-kc-read">Alles als gelezen markeren</button>' : '') + '</div>' +
    a.b.map(function (b, i) {
      var rk = kcBlockKey(a.id, i);
      var read = isItemRead(rk);
      return '<div class="bl ' + b[0] + ' ' + (read ? 'read' : 'unread') + '" id="bl-' + i + '" data-read-id="' + esc(rk) + '">' +
        '<div class="log-top"><span>' + (!read ? '<span class="item-badge-new">Nieuw</span>' : '') +
        '<span class="tag">' + (b[0] == "e" ? "Eis" : "Toelichting") + '</span></span></div>' +
        '<h4>' + b[1] + '</h4><p>' + b[2] + '</p></div>';
    }).join("") +
    '<button class="back" data-v="a">← Terug naar afvinklijst</button></div></div>';
}

function render() {
  if (!currentUser) {
    syncLoginState();
    return;
  }
  syncLoginState();
  nav();
  if (view == "d") {
    document.getElementById("v").innerHTML = dash();
  } else if (view == "a") {
    document.getElementById("v").innerHTML = chk();
  } else if (view == "w") {
    document.getElementById("v").innerHTML = wijzigingen();
  } else {
    document.getElementById("v").innerHTML = kc();
  }
  if (pendingTaskNote) {
    var noteEl = document.querySelector('[data-note-input="' + pendingTaskNote.sid + '"]');
    if (noteEl) {
      noteEl.focus();
    }
  }
}

function go(v) {
  rsArmed = false;
  clearTimeout(rsTimer);
  pendingTaskNote = null;
  editingLogId = "";
  view = v;
  if (v == "k" && ar === 0) {
    markErmSeen();
  }
  render();
  loadAccountData(false);
  window.scrollTo(0, 0);
}

document.getElementById("mode-login").addEventListener("click", function () {
  setAuthMode("login");
});

document.getElementById("mode-register").addEventListener("click", function () {
  setAuthMode("register");
});

document.getElementById("login-form").addEventListener("submit", function (e) {
  e.preventDefault();
  var userInp = document.getElementById("username-input");
  var passInp = document.getElementById("password-input");
  var errEl = document.getElementById("login-error");
  var btn = document.getElementById("login-submit-btn");

  var username = String(userInp.value || "").trim();
  var password = String(passInp.value || "");

  if (!username || !password) {
    errEl.textContent = "Vul zowel je gebruikersnaam als wachtwoord in.";
    return;
  }

  errEl.textContent = "";
  btn.disabled = true;
  btn.textContent = "Bezig met controleren…";

  fetch(AUTH_API, {
    method: "POST",
    cache: "no-store",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      mode: authMode,
      username: username,
      password: password
    })
  })
    .then(function (res) {
      return res.json().catch(function () {
        return {};
      }).then(function (data) {
        return { ok: res.ok, data: data };
      });
    })
    .then(function (result) {
      btn.disabled = false;
      setAuthMode(authMode);
      if (!result.ok || !result.data || !result.data.ok) {
        errEl.textContent = (result.data && result.data.error) || "Inloggen mislukt.";
        return;
      }
      passInp.value = "";
      setUserName(result.data.username);
    })
    .catch(function () {
      btn.disabled = false;
      setAuthMode(authMode);
      errEl.textContent = "Kan geen verbinding maken met Cloudflare. Controleer je internet.";
    });
});

document.getElementById("change-user").addEventListener("click", function () {
  currentUser = "";
  pendingTaskNote = null;
  editingLogId = "";
  syncLoginState();
  document.getElementById("username-input").value = "";
  document.getElementById("password-input").value = "";
  document.getElementById("login-error").textContent = "";
  setAuthMode("login");

    document.getElementById("username-input").focus();
  }, 20);
});

document.addEventListener("input", function (e) {
  if (e.target.id === "erm-search") {
    ermQuery = e.target.value || "";
    var pos = e.target.selectionStart || ermQuery.length;
    render();
    var el = document.getElementById("erm-search");
    if (el) {
      el.focus();
      el.setSelectionRange(pos, pos);
    }
    return;
  }
  var noteSid = e.target.dataset.noteInput;
  if (noteSid) {
    draftNotes[noteSid] = e.target.value;
    return;
  }
  if (e.target.id === "edit-log-textarea") {
    editingLogDraft = e.target.value;
  }
});

document.addEventListener("click", function (e) {
  var t = e.target.closest("button");
  if (t) {
    var d = t.dataset;
    if (t.id == "dash-refresh") {
      return refreshDashboardInPlace();
    }
    if (d.saveNote) {
      return saveTaskWithNote(d.saveNote);
    }
    if (d.cancelNote) {
      return cancelTaskNote(d.cancelNote);
    }
    if (d.editLog) {
      return startEditLogNote(d.editLog);
    }
    if (d.saveEditLog) {
      return saveEditLogNote(d.saveEditLog);
    }
    if (d.cancelEditLog) {
      return cancelEditLogNote();
    }
    if (t.id == "mark-all-read") {
      return markAllLogsRead();
    }
    if (t.id == "mark-all-kc-read") {
      return markAllKcRead();
    }
    if (t.id == "home") {
      return go("d");
    }
    if (t.id == "erm-ref") {
      loadAccountData(false);
      return loadErm(true);
    }
    if (t.id == "rs") {
      if (rsArmed) {
        clearTimeout(rsTimer);
        rsArmed = false;
        S = {};
        try {
          localStorage.removeItem(KEY);
        } catch (err) {}
        addChangeLog("Alle statussen teruggezet naar 'Te doen'.", "");
        save({ reset: true });
        render();
      } else {
        rsArmed = true;
        clearTimeout(rsTimer);
        rsTimer = setTimeout(function () {
          rsArmed = false;
          if (view == "d") {
            render();
          }
        }, 5000);
        render();
      }
      return;
    }
    if (d.ef) {
      ermFilter = d.ef;
      return render();
    }
    if (d.v) {
      return go(d.v);
    }
    if (d.c !== undefined) {
      ch = +d.c;
      return go("a");
    }
    if (d.a !== undefined) {
      ar = +d.a;
      return go("k");
    }
  }

  var readEl = e.target.closest("[data-read-id]");
  if (readEl) {
    markItemRead(readEl.dataset.readId);
  }
});

document.getElementById("home").addEventListener("click", function () {
  if (currentUser) {
    go("d");
  }
});

document.addEventListener("change", function (e) {
  var s = e.target.dataset.s;
  if (!s) {
    return;
  }
  var prevStatus = S[s] || "todo";
  var nextStatus = e.target.value;
  if (prevStatus === nextStatus) {
    return;
  }
  if (nextStatus === "busy" || nextStatus === "done") {
    pendingTaskNote = {
      sid: s,
      prevStatus: prevStatus,
      nextStatus: nextStatus
    };
    if (draftNotes[s] === undefined) {
      draftNotes[s] = "";
    }
    render();
    return;
  }
  pendingTaskNote = null;
  S[s] = nextStatus;
  var info = findTaskBySid(s);
  var label = info ? (info.chapter + " — " + info.task) : s;
  addChangeLog(label + ": " + statusLabel(prevStatus) + " → " + statusLabel(nextStatus), "");
  save();
  render();
});

setAuthMode("login");
syncLoginState();
loadErm(false);

if (hasSync()) {
  setInterval(function () {
    if (document.visibilityState === "visible" && currentUser) {
      loadAccountData(false);
    }
  }, 5000);
}

if (isConfigured()) {
  setInterval(function () {
    if (document.visibilityState === "visible" && currentUser) {
      loadErm(false);
    }
  }, 300000);
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible" && currentUser) {
      loadErm(false);
      loadAccountData(false);
    }
  });
}

if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("./sw.js").catch(function () {});
  });
}
</script>
